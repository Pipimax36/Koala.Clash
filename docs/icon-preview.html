<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koala Clash · 图标预览</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #f5f6f7;
        color: #20262d;
        font:
          14px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 860px;
        margin: auto;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 24px;
        color: #626d79;
      }
      section {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid #dfe3e8;
        border-radius: 14px;
        background: white;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      .app,
      .glyph {
        display: block;
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin: 0 auto 12px;
      }
      .glyph {
        background: currentColor;
        mask: var(--icon) center / contain no-repeat;
      }
      .off {
        --icon: url('../resources/brand/tray-inactive.png');
      }
      .on {
        --icon: url('../resources/brand/tray-active.png');
      }
      .dark {
        background: #22262d;
        border-color: #363e48;
        color: #edf0f4;
      }
      .actual {
        grid-template-columns: 1fr 1fr;
      }
      .actual .glyph {
        width: 20px;
        height: 20px;
        margin: 0;
      }
      .actual .off {
        --icon: url('../resources/icon_off_mac@2x.png');
      }
      .actual .on {
        --icon: url('../resources/icon_on_mac@2x.png');
      }
      .menu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        height: 32px;
      }
      .caption {
        font-size: 12px;
        color: #626d79;
      }
      @media (max-width: 540px) {
        body {
          padding: 18px;
        }
        section {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
          padding: 16px;
        }
        .app,
        .glyph {
          width: 72px;
          height: 72px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Koala Clash · 图标预览</h1>
      <p>森林绿考拉以钥匙孔形成负形；Dock 图标使用暖白底板。菜单栏以轮廓和实心区分代理状态。</p>
      <section aria-label="浅色背景">
        <figure>
          <img
            class="app"
            src="../resources/brand/mark.png"
            alt="森林绿考拉标志，中央是钥匙孔负形"
          />
          <figcaption>考拉标志</figcaption>
        </figure>
        <figure>
          <img
            class="app"
            src="../resources/brand/app-icon.png"
            alt="暖白底板上的森林绿考拉钥匙孔应用图标"
          />
          <figcaption>Dock 图标</figcaption>
        </figure>
        <figure>
          <span class="glyph off" role="img" aria-label="代理停用时的考拉轮廓模板"></span>
          <figcaption>停用 · 轮廓模板</figcaption>
        </figure>
        <figure>
          <span class="glyph on" role="img" aria-label="代理启用时的考拉实心模板"></span>
          <figcaption>启用 · 实心模板</figcaption>
        </figure>
      </section>
      <section class="dark" aria-label="深色背景">
        <figure>
          <img
            class="app"
            src="../resources/brand/mark.png"
            alt="森林绿考拉标志，中央是钥匙孔负形"
          />
          <figcaption>考拉标志</figcaption>
        </figure>
        <figure>
          <img
            class="app"
            src="../resources/brand/app-icon.png"
            alt="暖白底板上的森林绿考拉钥匙孔应用图标"
          />
          <figcaption>Dock 图标</figcaption>
        </figure>
        <figure>
          <span class="glyph off" role="img" aria-label="代理停用时的考拉轮廓模板"></span>
          <figcaption>停用 · 轮廓模板</figcaption>
        </figure>
        <figure>
          <span class="glyph on" role="img" aria-label="代理启用时的考拉实心模板"></span>
          <figcaption>启用 · 实心模板</figcaption>
        </figure>
      </section>
      <section class="actual" aria-label="菜单栏实际尺寸">
        <figure>
          <div class="menu">
            <span class="glyph off" role="img" aria-label="代理停用轮廓模板"></span
            ><span class="glyph on" role="img" aria-label="代理启用实心模板"></span>
          </div>
          <figcaption>菜单栏 20pt · 浅色</figcaption>
        </figure>
        <figure>
          <div class="menu dark">
            <span class="glyph off" role="img" aria-label="代理停用轮廓模板"></span
            ><span class="glyph on" role="img" aria-label="代理启用实心模板"></span>
          </div>
          <figcaption>菜单栏 20pt · 深色</figcaption>
        </figure>
      </section>
      <p class="caption">
        菜单栏根据代理启用状态切换模板；图标前景色由 macOS 自动适配。此页仅展示外观。
      </p>
    </main>
  </body>
</html>
