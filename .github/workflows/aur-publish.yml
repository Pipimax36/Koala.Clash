name: AUR Publish

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish to AUR'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to AUR (e.g. 1.4.1)'
        required: true
        type: string

jobs:
  aur-publish:
    if: vars.AUR_PUBLISH_ENABLED == 'true' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << 'SSHEOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSHEOF

      - name: Parse release version
        id: release
        env:
          TAG_INPUT: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_INPUT" ]; then
            echo "::error::Could not resolve a release tag"
            exit 1
          fi
          echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          echo "pkgver=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"

      - name: Clone AUR repository
        run: git clone ssh://aur@aur.archlinux.org/koala-clash-bin.git /tmp/aur-pkg

      - name: Download release assets and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p /tmp/aur-assets

          gh release download "$TAG" \
            -p "Koala.Clash_amd64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY"
          echo "sha_x86=$(sha256sum /tmp/aur-assets/Koala.Clash_amd64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          if gh release download "$TAG" \
            -p "Koala.Clash_arm64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "sha_arm=$(sha256sum /tmp/aur-assets/Koala.Clash_arm64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "has_arm=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No arm64 .deb found in release $TAG, publishing x86_64 only"
            echo "has_arm=false" >> "$GITHUB_OUTPUT"
          fi

          rm -rf /tmp/aur-assets

      - name: Update PKGBUILD
        working-directory: /tmp/aur-pkg
        env:
          PKGVER: ${{ steps.release.outputs.pkgver }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA_X86: ${{ steps.checksums.outputs.sha_x86 }}
          SHA_ARM: ${{ steps.checksums.outputs.sha_arm }}
          HAS_ARM: ${{ steps.checksums.outputs.has_arm }}
        run: |
          sed -i "s|^url=.*|url=\"https://github.com/${GITHUB_REPOSITORY}\"|" PKGBUILD
          sed -i '/^_release_tag=/d' PKGBUILD
          sed -i "/^pkgver=/a _release_tag=\"${TAG}\"" PKGBUILD
          sed -i 's|/releases/download/${pkgver}/|/releases/download/${_release_tag}/|g' PKGBUILD

          OLD_PKGVER=$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2- | tr -d "\"'")
          OLD_PKGREL=$(grep -m1 '^pkgrel=' PKGBUILD | cut -d= -f2- | tr -d "\"'")
          [[ "$OLD_PKGREL" =~ ^[0-9]+$ ]] || OLD_PKGREL=0

          sed -i "s/^pkgver=.*/pkgver=\"${PKGVER}\"/" PKGBUILD
          sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${SHA_X86}')|" PKGBUILD

          if [ "$HAS_ARM" == "true" ]; then
            sed -i 's/^arch=.*/arch=("x86_64" "aarch64")/' PKGBUILD
            # Restore the aarch64 lines if an earlier x86_64-only release stripped them
            if ! grep -q '^source_aarch64=' PKGBUILD; then
              sed -i '/^sha256sums_x86_64=/a source_aarch64=("${pkgname}-${pkgver}_arm64.deb::${url}/releases/download/${_release_tag}/Koala.Clash_arm64.deb")' PKGBUILD
            fi
            if grep -q '^sha256sums_aarch64=' PKGBUILD; then
              sed -i "s|^sha256sums_aarch64=.*|sha256sums_aarch64=('${SHA_ARM}')|" PKGBUILD
            else
              sed -i "/^source_aarch64=/a sha256sums_aarch64=('${SHA_ARM}')" PKGBUILD
            fi
          else
            sed -i 's/^arch=.*/arch=("x86_64")/' PKGBUILD
            sed -i '/^source_aarch64=/d' PKGBUILD
            sed -i '/^sha256sums_aarch64=/d' PKGBUILD
          fi

          # pkgrel: reset on a new version, bump when the same version is re-released
          if [ "$OLD_PKGVER" != "$PKGVER" ]; then
            PKGREL=1
          elif git diff --quiet -- PKGBUILD; then
            PKGREL="$OLD_PKGREL"
          else
            PKGREL=$((OLD_PKGREL + 1))
          fi
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD

          echo "${OLD_PKGVER}-${OLD_PKGREL} -> ${PKGVER}-${PKGREL}"

      - name: Generate .SRCINFO
        working-directory: /tmp/aur-pkg
        run: |
          docker run --rm -v "$(pwd):/pkg" archlinux:base-devel bash -c \
            "useradd -m -u $(id -u) builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push to AUR
        working-directory: /tmp/aur-pkg
        env:
          PKGVER: ${{ steps.release.outputs.pkgver }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Github Actions (coolcoala)"
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "Nothing changed, skipping push"
            exit 0
          fi

          git commit -m "Update to ${PKGVER}"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed to AUR on attempt ${attempt}"
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), rebasing onto remote and retrying"
            git pull --rebase || true
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push to AUR after 3 attempts"
          exit 1
