name: Build
run-name: Release ${{ inputs.version || 'preview' }} from ${{ github.ref_name }}
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version to release'
        required: false
#  push:
#    branches:
#      - master
#    tags:
#      - v*
#    paths-ignore:
#      - 'README.md'
#      - '.github/ISSUE_TEMPLATE/**'
#      - '.github/workflows/issues.yml'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            format: 7z
          - os: windows-latest
            arch: x64
            format: nsis
          - os: windows-latest
            arch: arm64
            format: 7z
          - os: windows-latest
            arch: arm64
            format: nsis

          - os: ubuntu-latest
            arch: x64
            format: deb
          - os: ubuntu-latest
            arch: x64
            format: rpm
          - os: ubuntu-latest
            arch: x64
            format: pacman
          - os: ubuntu-latest
            arch: arm64
            format: deb
          - os: ubuntu-latest
            arch: arm64
            format: rpm
          - os: ubuntu-latest
            arch: arm64
            format: pacman

          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64

    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.format && '-' || '' }}${{ matrix.format || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@10.33.0

      - name: Set Build Version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json')); p.version = process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"

      - name: Correct folder name on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sed -i "s/productName: Koala Clash/productName: Koala.Clash/" electron-builder.yml

      - name: Install Build Tools
        if: matrix.os == 'ubuntu-latest' && matrix.format == 'pacman'
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools fakeroot

      - name: Install Dependencies and Prepare
        shell: bash
        run: |
          # Build tools run on the host; electron-builder selects the target architecture below.
          SKIP_PREPARE=1 pnpm install --frozen-lockfile
          pnpm prepare --${{ matrix.arch }}

      - name: Create Apple API Key file
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" ]]; then
            mkdir -p ~/.appstoreconnect/private_keys
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          fi

      - name: Build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          CSC_NAME: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && format('~/.appstoreconnect/private_keys/AuthKey_{0}.p8', secrets.APPLE_API_KEY) || '' }}
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pnpm build:win ${{ matrix.format }} --${{ matrix.arch }}
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            pnpm build:linux ${{ matrix.format }} --${{ matrix.arch }}
          else
            if [[ -z "$CSC_LINK" ]]; then
              unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
            pnpm build:mac --${{ matrix.arch }}
          fi

      - name: Add Portable Flag
        if: matrix.os == 'windows-latest' && matrix.format == '7z'
        shell: pwsh
        run: |
          New-Item -Path "PORTABLE" -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
          }

      - name: Generate latest.yml
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: pnpm updater

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.format && '-' || '' }}${{ matrix.format || '' }}
          path: |
            dist/[Kk]oala?[Cc]lash*
            !dist/*.plist
            !dist/*blockmap*
            latest.yml
            changelog.md

  pre-release:
    if: needs.version.outputs.prerelease == 'true'
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body_path: bin/changelog.md
          files: |
            bin/latest.yml
            bin/dist/*
          prerelease: true

  release:
    if: needs.version.outputs.prerelease == 'false'
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Set Release Version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json')); p.version = process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Updater
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          npm install -g pnpm@10.33.0
          SKIP_PREPARE=1 pnpm install --frozen-lockfile
          pnpm updater

      - uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body_path: changelog.md
          files: |
            latest.yml
            bin/dist/*

      - name: Telegram Alert
        if: success() && vars.TELEGRAM_NOTIFICATIONS_ENABLED == 'true'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROUP_ID: ${{ secrets.TELEGRAM_TO_GROUP }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_TO_CHANNEL }}
        run: pnpm telegram

  aur:
    if: vars.AUR_PUBLISH_ENABLED == 'true'
    needs: [release, version]
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
